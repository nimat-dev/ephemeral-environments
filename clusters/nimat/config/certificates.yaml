apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-preview
  namespace: traefik
spec:
  secretName: wildcard-preview-tls
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer
  commonName: "*.preview.nimat.dev"
  dnsNames:
    - "*.preview.nimat.dev"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-shop-preview-nimat-dev
  namespace: traefik
spec:
  secretName: wildcard-shop-preview-nimat-dev-tls
  issuerRef:
    name: letsencrypt-dns-shop-preview-nimat-dev
    kind: ClusterIssuer
  commonName: "*.shop.preview.nimat.dev"
  dnsNames:
    - "*.shop.preview.nimat.dev"
