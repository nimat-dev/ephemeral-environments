# One ClusterIssuer + wildcard Certificate per project domain (a3 base zone, a7 extra zones — DEC-047).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-dns-key
    solvers:
      - dns01:
          azureDNS:
            subscriptionID: 1325f79b-c2c1-437c-a8c7-a0746ab748d4
            resourceGroupName: nimatresourceg
            hostedZoneName: preview.nimat.dev
            environment: AzurePublicCloud
            managedIdentity:
              clientID: 51134be3-ce07-4286-bca2-e945232b3410
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns-shop-preview-nimat-dev
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-dns-shop-preview-nimat-dev-key
    solvers:
      - dns01:
          azureDNS:
            subscriptionID: 1325f79b-c2c1-437c-a8c7-a0746ab748d4
            resourceGroupName: nimatresourceg
            hostedZoneName: shop.preview.nimat.dev
            environment: AzurePublicCloud
            managedIdentity:
              clientID: 51134be3-ce07-4286-bca2-e945232b3410
