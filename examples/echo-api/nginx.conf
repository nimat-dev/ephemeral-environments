server {
    listen 8080;
    server_name _;
    default_type application/json;

    location = /api/health { return 200 '{"component":"api","status":"ok"}'; }
    location /api          { return 200 '{"component":"api","path":"$uri"}'; }
    location /             { return 404 '{"component":"api","error":"not found"}'; }
}
