name: Destroy Preview
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose preview to destroy
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  preview:
    uses: ./.github/workflows/kit-destroy.yml
    with:
      branch: ${{ inputs.branch }}
      kit_ref: ${{ github.sha }}
