name: Deploy Preview
# This repo dogfoods the kit at its own commit (F021). Other repos: see examples/consumer/.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        type: string
      lifetime:
        description: Delete the whole preview after
        required: true
        default: "48h"
        type: choice
        options: ["24h", "48h", "7d", "custom"]
      lifetime_custom:
        description: Custom lifetime (e.g. 12h, 3d) — used only when lifetime=custom
        required: false
        type: string
      idle_timeout:
        description: Scale to 0 after this much idle
        required: true
        default: "30m"
        type: choice
        options: ["15m", "30m", "1h", "6h", "never"]
      max_replicas:
        description: Max replicas when awake
        required: false
        default: "3"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  preview:
    uses: ./.github/workflows/kit-deploy.yml
    with:
      branch: ${{ inputs.branch }}
      lifetime: ${{ inputs.lifetime }}
      lifetime_custom: ${{ inputs.lifetime_custom }}
      idle_timeout: ${{ inputs.idle_timeout }}
      max_replicas: ${{ inputs.max_replicas }}
      kit_ref: ${{ github.sha }}
