name: Kit - Release
# Tag vX.Y.Z on main (after scripts/kit-release.sh prepare X.Y.Z merged) → checks, chart to ACR OCI, GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # the GitHub release (rule 7 exception, DEC-051)
  id-token: write

concurrency:
  group: kit-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: preview
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify tag matches every pinned version
        run: ./scripts/kit-release.sh verify

      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish chart (OCI)
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: ./scripts/kit-release.sh publish-chart

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/kit-release.sh github-release
