name: Kit - Destroy Preview
# Reusable preview destroy (F021, DEC-051); shares the deploy concurrency group per branch.
on:
  workflow_call:
    inputs:
      branch:
        description: Branch whose preview to destroy
        required: true
        type: string
      kit_repository:
        description: Where the kit lives (this repo).
        required: false
        default: nimat-dev/ephemeral-environments
        type: string
      kit_ref:
        description: Kit version to run (release tag; bumped by scripts/kit-release.sh).
        required: false
        default: v1.0.0
        type: string
permissions:
  id-token: write
  contents: read
# Same group as Deploy Preview: a destroy never races a deploy of the same branch.
concurrency:
  group: preview-${{ inputs.branch }}
  cancel-in-progress: false
jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: preview
    env:
      BRANCH: ${{ inputs.branch }}
      PREVIEW_APP: ${{ vars.PREVIEW_APP }} # F015: same app slug as deploy
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.kit_repository }}
          ref: ${{ inputs.kit_ref }}
          path: .kit
          persist-credentials: false
      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/use-kubelogin@v1.3
        with:
          kubelogin-version: v0.2.20
      - uses: azure/aks-set-context@v5.0.0
        with:
          cluster-name: ${{ vars.AKS_CLUSTER }}
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          admin: false
          use-kubelogin: true
      - name: Delete namespace
        uses: ./.kit/kit
        with:
          command: destroy
