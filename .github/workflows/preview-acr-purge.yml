name: Purge Stale Preview Images
on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be purged, delete nothing
        required: false
        default: false
        type: boolean
      max_age:
        description: Purge tags last updated longer ago than this (Nm, Nh, Nd)
        required: false
        default: "7d"
        type: string
      keep:
        description: Always keep this many newest tags
        required: false
        default: "3"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  preview:
    uses: ./.github/workflows/kit-purge.yml
    with:
      dry_run: ${{ inputs.dry_run || false }}
      max_age: ${{ inputs.max_age || '7d' }}
      keep: ${{ inputs.keep || '3' }}
      kit_ref: ${{ github.sha }}
