{{- range $i, $c := (include "preview.components" . | fromJson).items }}
{{- if $i }}
---
{{- end }}
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: {{ $c.fullname }}
  labels:
    {{- include "preview.componentLabels" (dict "c" $c "root" $) | nindent 4 }}
spec:
  hosts:
    - {{ $.Values.host | quote }}
  {{- if $c.byPath }}
  # The interceptor routes host + longest path prefix to this component (DEC-044).
  pathPrefixes:
    - {{ $c.route | quote }}
  {{- end }}
  scaleTargetRef:
    name: {{ $c.fullname }}
    kind: Deployment
    apiVersion: apps/v1
    service: {{ $c.fullname }}
    port: 80
  replicas:
    min: {{ $.Values.replicas.min }}
    max: {{ $.Values.replicas.max }}
  scaledownPeriod: {{ $.Values.idleTimeoutSeconds }}
{{- end }}
