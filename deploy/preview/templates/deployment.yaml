{{- range $i, $c := (include "preview.components" . | fromJson).items }}
{{- if $i }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $c.fullname }}
  labels:
    {{- include "preview.componentLabels" (dict "c" $c "root" $) | nindent 4 }}
  annotations:
    preview.branch: {{ $.Values.branch | quote }}
    preview.commit: {{ $.Values.commit | quote }}
spec:
  # No replicas field: KEDA owns the replica count. Setting it here fights the autoscaler.
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $c.fullname }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $c.fullname }}
    spec:
      containers:
        - name: app
          image: "{{ $c.image.repository }}:{{ $c.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $c.port }}
          readinessProbe:
            httpGet:
              path: {{ $c.probePath }}
              port: {{ $c.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ $c.probePath }}
              port: {{ $c.port }}
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: {{ $c.resources.requests.cpu }}
              memory: {{ $c.resources.requests.memory }}
            limits:
              cpu: {{ $c.resources.limits.cpu }}
              memory: {{ $c.resources.limits.memory }}
{{- end }}
