apiVersion: v1
kind: Service
metadata:
  name: {{ include "preview.fullname" . }}
  labels:
    {{- include "preview.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "preview.fullname" . }}
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.containerPort }}
