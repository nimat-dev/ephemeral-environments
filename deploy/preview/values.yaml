# All overridden per-deploy from the workflow via --set.
name: preview            # release name; used as app/deployment/service name
host: ""                 # e.g. branch-123.preview.alleghenycounty.us

image:
  repository: ""         # ACR_LOGIN_SERVER/APP_IMAGE_NAME
  tag: ""                # short git sha
  pullPolicy: IfNotPresent

containerPort: 8080
probePath: /             # set to a real health endpoint if / doesn't 200

replicas:
  min: 0
  max: 3

idleTimeoutSeconds: 1800 # scale to 0 after this much no-traffic (KEDA scaledownPeriod)

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# One quota per preview namespace so 40 abandoned branches can't eat the cluster.
quota:
  cpu: "2"
  memory: 4Gi
  pods: "6"

interceptor:
  fqdn: keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local
  port: 8080

ingressClassName: nginx

# F016 (DEC-044): one entry per workload, routed by path prefix on the same host. Empty = legacy single
# workload from name/image/containerPort/probePath above. Set per deploy from the app's .preview.yaml:
#   - name: api
#     image: {repository: <acr>/<app>/api, tag: <sha>}
#     port: 8080
#     probePath: /api/health
#     route: /api
#     resources: {requests: {cpu: 250m}}   # merged over `resources`
components: []
commit: ""
branch: ""
