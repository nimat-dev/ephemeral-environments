# KEDA HTTP add-on sized for a single 2-vCPU node (quota allows no second node, DEC-019).
# Chart defaults (3 scalers, 3+ interceptors, 250m requests each) don't schedule there.
operator:
  resources:
    requests:
      cpu: 50m
scaler:
  replicas: 1
  resources:
    requests:
      cpu: 50m
interceptor:
  replicas:
    min: 1
    max: 3
  resources:
    requests:
      cpu: 50m
