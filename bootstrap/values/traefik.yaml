# Traefik v3 for preview environments (DEC-021).
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik
providers:
  kubernetesIngress:
    # Preview Ingresses route to an ExternalName Service pointing at the KEDA interceptor.
    allowExternalNameServices: true
    publishedService:
      enabled: true
ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
